<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>小千 · 任务面板</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1f2328;--dim:#6b7280;--line:#e2dfd8;--accent:#2f6f5e;
  --ok:#2e7d4f;--run:#2563a8;--bad:#b3372e;--wait:#8a8f98;--chip:#eef1ee}
@media(prefers-color-scheme:dark){:root{--bg:#141618;--card:#1e2125;--ink:#e7e7e7;--dim:#9aa1ab;--line:#2e3238;--accent:#6fbfa7;
  --ok:#6fcf97;--run:#7fb4ef;--bad:#f08a80;--wait:#8a8f98;--chip:#262a2f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:0 max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;z-index:1}
h1{font-size:18px;margin:0}
#sync{font-size:12px;color:var(--dim);text-align:right}
#sync.off{color:var(--bad)}
main{max-width:720px;margin:0 auto}
header{max-width:720px;margin:0 auto}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.sum span{background:var(--chip);border-radius:12px;padding:2px 10px;font-size:13px;color:var(--dim)}
.sum b{color:var(--ink)}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.task h2{font-size:16px;margin:0;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.task h2 .t{min-width:0;overflow-wrap:anywhere}
.task h2 .s{flex:none;font-size:13px;font-weight:600}
.meta{font-size:12px;color:var(--dim);margin:2px 0 8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.task.failed .bar i{background:var(--bad)}.task.cancelled .bar i{background:var(--wait)}
.step{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.step .st{flex:none;width:52px;font-size:12px;font-weight:600}
.step .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.step small{display:block;color:var(--dim);font-size:12px}
.step button{flex:none;font:inherit;font-size:13px;min-height:32px;padding:2px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--accent)}
.succeeded{color:var(--ok)}.running{color:var(--run)}.failed,.blocked{color:var(--bad)}.pending,.queued,.cancelled{color:var(--wait)}
.empty{color:var(--dim);text-align:center;padding:48px 0}
#view{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:2}
#view.on{display:flex}
#view header{width:100%;padding:12px 16px;border-bottom:1px solid var(--line);position:static}
#view pre{flex:1;margin:0;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,Consolas,"PingFang SC",monospace}
#view button{font:inherit;min-height:36px;padding:4px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<header><h1>小千 · 任务面板</h1><div id="sync">连接中…</div></header>
<main>
  <div class="sum" id="sum"></div>
  <div id="tasks"><div class="empty">还没有任务</div></div>
  <footer>只读面板 · 进度来自执行事件 · 要取消或重试，在微信里跟小千说</footer>
</main>
<div id="view"><header><b id="vt"></b><button id="vx">关闭</button></header><pre id="vb"></pre></div>
<script>
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const base = location.pathname.replace(/\/?$/, '/');
const ST = {pending: '等待', running: '执行中', succeeded: '完成', failed: '失败', blocked: '未执行', cancelled: '已取消', queued: '排队中'};
const hm = iso => iso ? new Date(iso).toLocaleString('zh-CN', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '';
function dur(a, b) { if (!a) return ''; const s = Math.max(0, Math.round((new Date(b || Date.now()) - new Date(a)) / 1000)); return s < 60 ? s + ' 秒' : s < 3600 ? Math.floor(s / 60) + ' 分 ' + s % 60 + ' 秒' : Math.floor(s / 3600) + ' 小时 ' + Math.floor(s % 3600 / 60) + ' 分'; }
function render(tasks) {
  const n = k => tasks.filter(t => t.status === k).length;
  $('sum').innerHTML = [['执行中', n('running')], ['排队', n('queued')], ['完成', n('succeeded')], ['失败', n('failed')]].map(([l, v]) => `<span>${l} <b>${v}</b></span>`).join('');
  if (!tasks.length) return;
  $('tasks').innerHTML = tasks.slice().reverse().map(t => `<div class="task ${t.status}">
    <h2><span class="t">#${t.id} ${esc(t.title)}</span><span class="s ${t.status}">${ST[t.status]} ${t.counts.succeeded}/${t.counts.total}</span></h2>
    <div class="meta">${hm(t.createdAt)} 创建${t.startedAt ? ' · 用时 ' + dur(t.startedAt, t.finishedAt) : ''}${t.mock ? ' · 模拟' : ''}</div>
    <div class="bar"><i style="width:${t.percent}%"></i></div>
    ${t.steps.map(s => `<div class="step"><span class="st ${s.status}">${ST[s.status]}</span><span class="nm">${esc(s.title)}
      <small>${[s.id, s.dependsOn.length && s.id !== 'final' ? '依赖 ' + s.dependsOn.join('、') : '', s.status === 'running' ? (s.total ? `${s.done || 0}/${s.total}` : esc(s.note || '')) + ' 已 ' + dur(s.startedAt) : '',
        s.attempt > 1 ? `第 ${s.attempt} 次` : '', s.error ? esc(s.error) : ''].filter(Boolean).join(' · ')}</small></span>
      ${s.artifact ? `<button data-t="${t.id}" data-s="${esc(s.id)}" data-n="${esc(s.title)}">产物</button>` : ''}</div>`).join('')}
  </div>`).join('');
}
async function tick() {
  if (document.hidden) return;
  try {
    const r = await fetch(base + 'api/state', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    render(s.tasks);
    $('sync').className = ''; $('sync').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch { $('sync').className = 'off'; $('sync').textContent = '连接不上，稍后自动重试'; }
}
$('tasks').onclick = async e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  $('vt').textContent = `#${b.dataset.t} ${b.dataset.n}`; $('vb').textContent = '读取中…'; $('view').className = 'on';
  try { const r = await fetch(`${base}api/artifact/${b.dataset.t}/${b.dataset.s}`, {cache: 'no-store'}); $('vb').textContent = r.ok ? await r.text() : '读取失败'; }
  catch { $('vb').textContent = '读取失败'; }
};
$('vx').onclick = () => { $('view').className = ''; };
document.addEventListener('visibilitychange', tick);
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
